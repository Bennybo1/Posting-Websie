{% extends "base.html" %}


{% block title %}<title>View_Posts</title>{% endblock %}


{% block header_content %}
<h1>View Posts</h1>
<h4>Look at What Others Are up to!</h4>
{% endblock %}


{% block content %}
	{% for post in posts %}
		<div class="container">
			<div class="namebar">
				<h3 class="title">{{post.title}}</h3><p class="name">{{post.username}}</p><p class="date">{{post.date}}</p>
			</div>
			
			<p class="description">{{post.description}}</p>
		</div>	
		{% endfor %}
	<form action="/account" method="GET">
		<button type="submit" class="back_button2">Back</button>
	</form>
{% endblock %}
